    <text x="1331" y="526" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="750">TTS</text>
    <text class="card-title" x="1370" y="514">MiniMax TTS</text>
    <text class="card-subtitle" x="1370" y="535">可选云 provider</text>
    <text class="card-text" x="1308" y="568">句边界失败回退 OmniVoice</text>

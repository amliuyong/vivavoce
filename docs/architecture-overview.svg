    <text class="card-text" x="392" y="452">Agent / QuestionBank / Session CRUD</text>
    <text class="card-text" x="392" y="475">题目固化 · 鉴权 · 容量准入</text>
    <text class="card-text" x="392" y="498">系统配置 · 集成 API · MCP</text>
    <rect x="392" y="516" width="212" height="22" rx="6" fill="#dcefee"/>
    <text class="mono" x="498" y="531" text-anchor="middle">backend/ · :8000</text>
  </g>

  <g>
    <rect x="666" y="360" width="252" height="190" rx="8" fill="#f2f7fc" stroke="#6f9fc7"/>
    <rect x="666" y="360" width="252" height="7" rx="3" fill="#1769aa"/>
    <rect x="686" y="384" width="46" height="46" rx="8" fill="#1769aa"/>
    <text x="709" y="412" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="750">RT</text>
    <text class="card-title" x="748" y="400">实时会话服务</text>
    <text class="card-subtitle" x="748" y="420">Node / TypeScript · Fargate</text>
    <text class="card-text" x="686" y="452">端点检测 · DTD / barge-in</text>
    <text class="card-text" x="686" y="475">turn-taking · 题目推进 · 收尾</text>
    <text class="card-text" x="686" y="498">录音 · 转写 · per-turn metrics</text>
    <rect x="686" y="516" width="212" height="22" rx="6" fill="#e0edf7"/>
    <text class="mono" x="792" y="531" text-anchor="middle">bridge/ · :3001</text>
  </g>

  <g>
    <rect x="960" y="360" width="234" height="190" rx="8" fill="#fff9ef" stroke="#d0a35b"/>
    <rect x="960" y="360" width="234" height="7" rx="3" fill="#aa6b12"/>
    <rect x="980" y="384" width="46" height="46" rx="8" fill="#aa6b12"/>

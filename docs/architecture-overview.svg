<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VivaVoce architecture overview</title>
  <desc id="desc">
    VivaVoce deployment architecture showing thin clients, the public ALB entry, control plane,
    realtime session plane, private GPU speech inference, external Bedrock LLM, and the data and event plane.
    The same topology is deployed in AWS Global and AWS China partitions.
  </desc>

  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#566574"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#aa6b12"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#2d8057"/>
    </marker>
    <style>
      text {
        font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        letter-spacing: 0;
      }
      .page-title { fill: #17212b; font-size: 30px; font-weight: 750; }
      .page-subtitle { fill: #64717d; font-size: 14px; }
      .boundary-title { fill: #26323d; font-size: 15px; font-weight: 700; }
      .boundary-note { fill: #697681; font-size: 12px; }
      .card-title { fill: #17212b; font-size: 17px; font-weight: 750; }
      .card-subtitle { fill: #46535f; font-size: 12.5px; font-weight: 650; }
      .card-text { fill: #52606c; font-size: 12px; }
      .small { fill: #687581; font-size: 11px; }
      .mono { fill: #3f4c58; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10.5px; }
      .tag { fill: #ffffff; font-size: 11px; font-weight: 750; }
      .route { fill: #34414d; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10.5px; }
      .flow-label { fill: #43515d; font-size: 10.5px; font-weight: 650; }
      .live-label { fill: #1769aa; font-size: 10.5px; font-weight: 700; }
      .external-label { fill: #9b5f0c; font-size: 10.5px; font-weight: 700; }
      .footer-title { fill: #aeb9c4; font-size: 11px; font-weight: 700; }
      .footer-text { fill: #ffffff; font-size: 11.5px; }
      .control-flow { fill: none; stroke: #566574; stroke-width: 1.8; marker-end: url(#arrow-gray); vector-effect: non-scaling-stroke; }
      .live-flow { fill: none; stroke: #1769aa; stroke-width: 4; marker-end: url(#arrow-blue); vector-effect: non-scaling-stroke; }
      .live-flow-bi { fill: none; stroke: #1769aa; stroke-width: 4; marker-start: url(#arrow-blue); marker-end: url(#arrow-blue); vector-effect: non-scaling-stroke; }
      .external-flow { fill: none; stroke: #aa6b12; stroke-width: 3.2; marker-end: url(#arrow-amber); vector-effect: non-scaling-stroke; }
      .event-flow { fill: none; stroke: #2d8057; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow-green); vector-effect: non-scaling-stroke; }
      .optional-flow { fill: none; stroke: #aa6b12; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow-amber); vector-effect: non-scaling-stroke; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f7f9"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="96" fill="#ffffff"/>
  <rect x="0" y="95" width="1600" height="1" fill="#d8e0e6"/>
  <text class="page-title" x="46" y="43">VivaVoce 架构一览</text>
  <text class="page-subtitle" x="46" y="70">薄客户端 · 厚服务端 · 三段式实时语音 · 双分区同构部署</text>

  <rect x="1190" y="27" width="92" height="34" rx="8" fill="#e7f2f8" stroke="#7aaaca"/>
  <text x="1236" y="49" text-anchor="middle" fill="#1769aa" font-size="12" font-weight="750">AWS Global</text>
  <rect x="1294" y="27" width="92" height="34" rx="8" fill="#fff3df" stroke="#d8a44a"/>
  <text x="1340" y="49" text-anchor="middle" fill="#8f5a0d" font-size="12" font-weight="750">AWS China</text>
  <rect x="1398" y="27" width="156" height="34" rx="8" fill="#17212b"/>
  <text x="1476" y="49" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="750">ONE CODEBASE</text>


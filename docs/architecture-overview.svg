  <rect x="34" y="122" width="264" height="646" rx="8" fill="#ffffff" stroke="#d2dbe2"/>
  <text class="boundary-title" x="54" y="151">客户端与身份</text>
  <text class="boundary-note" x="54" y="172">公网 / 外置身份域</text>

  <g>
    <rect x="54" y="196" width="224" height="178" rx="8" fill="#f7fafc" stroke="#aebbc5"/>
    <rect x="54" y="196" width="224" height="6" rx="3" fill="#1769aa"/>
    <rect x="72" y="220" width="44" height="44" rx="8" fill="#1769aa"/>
    <text x="94" y="247" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="750">UI</text>
    <text class="card-title" x="130" y="238">三端客户端</text>
    <text class="card-subtitle" x="130" y="258">Web 现行 · 原生端后续</text>
    <text class="card-text" x="72" y="292">音频采集 / 播放 · 信令 · UI</text>
    <text class="card-text" x="72" y="315">本地打断检测 · 播放 worklet</text>
    <rect x="72" y="333" width="188" height="25" rx="6" fill="#e7f2f8"/>
    <text class="mono" x="166" y="350" text-anchor="middle">WSS + PCM → WebRTC</text>
  </g>

  <g>
    <rect x="54" y="400" width="224" height="105" rx="8" fill="#f7fafc" stroke="#aebbc5"/>
    <rect x="72" y="420" width="44" height="44" rx="8" fill="#566574"/>
    <text x="94" y="447" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="750">EXT</text>
    <text class="card-title" x="130" y="438">外部系统</text>
    <text class="card-subtitle" x="130" y="458">Integration API / MCP</text>
    <text class="card-text" x="72" y="487">API Key · 委托 token · Webhook</text>
  </g>

  <g>
    <rect x="54" y="532" width="224" height="188" rx="8" fill="#f6faf7" stroke="#8bb59d"/>
    <rect x="54" y="532" width="224" height="6" rx="3" fill="#2d8057"/>
    <rect x="72" y="557" width="44" height="44" rx="8" fill="#2d8057"/>
    <text x="94" y="584" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="750">ID</text>
    <text class="card-title" x="130" y="575">外置 OIDC</text>
    <text class="card-subtitle" x="130" y="595">Cognito today</text>
    <text class="card-text" x="72" y="628">JWT / JWKS 本地验签</text>
    <text class="card-text" x="72" y="650">Global 本区 · 中国区复用美东</text>
    <text class="card-text" x="72" y="672">目标：Authorization Code + PKCE</text>
    <rect x="72" y="688" width="188" height="19" rx="6" fill="#dfefe5"/>
    <text x="166" y="702" text-anchor="middle" fill="#2d6f4e" font-size="10.5" font-weight="700">登录跨境，热路径区内验签</text>
  </g>

  <!-- Center: AWS region / VPC -->
  <rect x="326" y="122" width="914" height="646" rx="8" fill="#ffffff" stroke="#9eabb6" stroke-width="1.5"/>
  <rect x="326" y="122" width="914" height="43" rx="8" fill="#edf1f4"/>
  <text class="boundary-title" x="348" y="149">AWS 部署 Region / VPC</text>
  <text class="boundary-note" x="540" y="149">同一 CDK Stack 运行于 aws 与 aws-cn；除 LLM 调用外，数据留在本区</text>

  <!-- Public entry -->
  <g>
    <rect x="372" y="190" width="822" height="104" rx="8" fill="#f7fafc" stroke="#738391"/>
    <rect x="372" y="190" width="822" height="7" rx="3" fill="#17212b"/>
    <rect x="392" y="214" width="48" height="48" rx="8" fill="#17212b"/>
    <text x="416" y="243" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="750">443</text>
    <text class="card-title" x="458" y="228">唯一公网入口</text>
    <text class="card-subtitle" x="458" y="249">Public ALB · HTTPS/WSS · ACM · REGIONAL WAF</text>
    <text class="card-text" x="458" y="271">无 CloudFront；静态前端由 backend 容器托管</text>

    <rect x="840" y="214" width="142" height="28" rx="6" fill="#e9eef2"/>
    <text class="route" x="911" y="232" text-anchor="middle">/  ·  /api/*</text>
    <rect x="994" y="214" width="180" height="28" rx="6" fill="#e7f2f8"/>
    <text class="route" x="1084" y="232" text-anchor="middle">/rt/ws · /v1/realtime</text>
    <text class="small" x="840" y="267">控制面目标</text>
    <text class="small" x="994" y="267">实时会话目标</text>
  </g>

  <!-- Plane tags -->

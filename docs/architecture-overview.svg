    <text class="card-title" x="1042" y="400">ASR + TTS</text>
    <text class="card-subtitle" x="1042" y="420">ECS on private GPU EC2</text>
    <text class="card-text" x="980" y="452">FunASR streaming ASR</text>
    <text class="card-text" x="980" y="475">OmniVoice voice-clone TTS</text>
    <text class="card-text" x="980" y="498">liveness / readiness · capacity</text>
    <rect x="980" y="516" width="194" height="22" rx="6" fill="#f5e6c7"/>
    <text class="mono" x="1077" y="531" text-anchor="middle">gpu/ · private WS</text>
  </g>

  <!-- Data and event row -->

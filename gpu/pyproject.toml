[project]
name = "vivavoce-gpu"
version = "0.1.0"
description = "VivaVoce GPU inference service for streaming ASR and TTS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "numpy>=1.26",
    "boto3>=1.34",  # design contract:会话期 ecs:UpdateTaskProtection(防缩容/部署腰斩在途)+ CloudWatch 指标
]

[project.optional-dependencies]
# 真实模型(在带 GPU 的镜像里装;本地无 GPU 不装)。ASR=FunASR,TTS=真 OmniVoice(vendor/omnivoice 源码)。
# 注:torch/torchaudio 由 AWS DLC base 提供,这里不再列(避免覆盖 DLC 的 CUDA 版 torch)。
# OmniVoice 推理依赖(照 deployment environment the upstream OmniVoice dependency list,只取推理必需,去掉 gradio/训练相关)。
models = [
    "funasr==1.3.14",
    "modelscope>=1.18",
    "transformers>=5.3.0",
    "accelerate",
    "pydub",
    "soundfile",
    "librosa",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["asyncio: async test"]

[tool.setuptools.packages.find]
include = ["gpu_service*"]

[tool.ruff]
target-version = "py312"
line-length = 120
# vendor/omnivoice 是第三方源码(k2-fsa/OmniVoice),不归本项目 lint
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",    # 行长交给 formatter
    "B008",
    "UP042",   # 保留 (str, Enum) 写法(协议枚举显式 str 序列化,不强制 StrEnum)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
